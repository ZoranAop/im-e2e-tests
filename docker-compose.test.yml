version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: im-test-mysql
    tmpfs: /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: testpass123
      MYSQL_DATABASE: imdb
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --max-connections=10000 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: im-test-mongodb
    tmpfs: /data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    name: im-test-network
