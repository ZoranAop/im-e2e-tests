name: IM E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass123
          MYSQL_DATABASE: imdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      IM_HOST: localhost
      IM_HTTP_PORT: 18080
      IM_ADMIN_PORT: 18080
      IM_ADMIN_SECRET: 123456

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (bc, curl, mysql client, k6)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc curl mysql-client netcat-openbsd
          # k6 (real load-test gate with thresholds)
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create .env
        run: |
          cp .env.example .env
          echo "MYSQL_PASS=testpass123" >> .env
          echo "MYSQL_DB=imdb" >> .env

      - name: Start mock IM server (stand-in SUT)
        run: |
          python3 ci/mock_im_server.py 18080 > /tmp/mock_im.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://localhost:18080/api/version >/dev/null; then
              echo "mock IM server is up"; break
            fi
            sleep 0.5
          done

      - name: Syntax Check (Bash)
        run: |
          find . -name "*.sh" -not -path './.git/*' -exec bash -n {} \;

      - name: Check Prerequisites
        run: |
          bash performance/run_single_chat_test.sh check
          bash performance/run_group_chat_test.sh check
          bash performance/run_chatroom_test.sh check
          bash performance/run_cluster_test.sh check
          bash performance/run_mixed_workload_test.sh check

      - name: Smoke Test (Push)
        run: |
          bash push/test_push_server.sh

      - name: Smoke Test (Square)
        run: |
          bash square/test_moments_api.sh --user-id "ci_test_user"
          bash square/test_square_api.sh --user-id "ci_test_user"

      - name: k6 Load Test (real threshold gate)
        run: |
          k6 run -e IM_HOST=localhost -e IM_PORT=18080 -e ADMIN_PORT=18080 performance/k6_single_chat.js
        # k6 exits non-zero when any threshold is breached -> fails the build.

      - name: Performance Benchmark Verification (shell assertions)
        run: |
          RATE=19646 TOTAL=10000000 SUCCESS=100 P99=45 P95=32 CPU=90 \
            bash performance/run_single_chat_test.sh --mode verify
          MEASURED_MIX_RATE=108 MEASURED_MIX_SUCCESS=100 \
            bash performance/run_mixed_workload_test.sh --mode verify
          MEASURED_CR_RATE=13000 MEASURED_CR_SUCCESS=100 \
            bash performance/run_cluster_test.sh --mode verify
          LC_DROPOFF=0 LC_CPU=10 LC_MYSQL=0 \
            bash performance/run_long_connection_test.sh --mode verify

      - name: Performance Estimation
        run: |
          bash performance/calc_performance.sh --all

      - name: Test Summary
        if: always()
        run: |
          echo "CI pipeline completed."
